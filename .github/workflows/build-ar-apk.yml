name: Build Arabic APK

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    paths:
      - 'ui/lib/**'
      - '.github/workflows/build-ar-apk.yml'

permissions:
  contents: read

env:
  JAVA_VERSION: '21'
  FLUTTER_VERSION: '3.47.2'
  ANDROID_BUILD_TOOLS_VERSION: '36.0.0'
  ANDROID_PLATFORM_VERSION: '37.0'
  ANDROID_CMAKE_VERSION: '3.22.1'
  NDK_VERSION: '28.2.13676358'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android/sdk/ndk \
            "$AGENT_TOOLSDIRECTORY/Haskell" || true
          df -h /

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_PLATFORM_VERSION}" \
            "build-tools;${ANDROID_BUILD_TOOLS_VERSION}" \
            "cmake;${ANDROID_CMAKE_VERSION}" \
            "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Generate signing keystore
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/release.jks" \
            -storepass arabiclocalization -keypass arabiclocalization \
            -alias omnibot-ar -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=OmniBot Arabic, OU=Local, O=Local, L=Passau, C=DE"
          chmod 600 "$RUNNER_TEMP/release.jks"
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Flutter dependencies
        working-directory: ui
        run: |
          set -euo pipefail
          flutter --version
          flutter pub get --enforce-lockfile

      - name: Ensure Flutter module android bridge
        working-directory: ui
        run: |
          set -euo pipefail
          if [[ ! -f .android/include_flutter.groovy ]]; then
            echo "Generating ephemeral .android bridge..."
            flutter create --platforms=android --project-name ui .
          fi
          test -f .android/include_flutter.groovy
          echo "bridge ready"

      - name: Build release APK
        env:
          GRADLE_OPTS: >-
            -Dorg.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g
            -Dfile.encoding=UTF-8 --enable-native-access=ALL-UNNAMED
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --build-cache --max-workers=4 \
            assembleProductionStandardRelease \
            -Ptarget=lib/main_standard.dart \
            -POMNI_RELEASE_STORE_FILE="$RELEASE_KEYSTORE_PATH" \
            -POMNI_RELEASE_STORE_PWD=arabiclocalization \
            -POMNI_RELEASE_KEY_ALIAS=omnibot-ar \
            -POMNI_RELEASE_KEY_PWD=arabiclocalization

      - name: Collect APK
        run: |
          set -euo pipefail
          mkdir -p out
          find app/build/outputs/apk -name '*.apk' -print -exec cp {} out/ \; || true
          ls -lh out/ || true
          test -n "$(ls -A out 2>/dev/null)" || { echo "No APK produced"; exit 1; }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: omnibot-arabic-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30
